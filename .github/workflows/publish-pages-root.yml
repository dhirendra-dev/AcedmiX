name: Publish legacy GitHub Pages root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: publish Pages build') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build from source template
        run: |
          cp index.source.html index.html
          npm run build

      - name: Publish build to the legacy Pages root
        run: |
          rm -rf assets
          cp -a dist/assets assets
          cp dist/favicon.svg favicon.svg
          cp dist/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg
          if git diff --cached --quiet; then
            echo "No Pages changes to commit."
            exit 0
          fi
          git commit -m "chore: publish Pages build"
          git push
